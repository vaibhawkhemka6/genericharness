<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Agent OS</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='12' fill='%23C15F3C'/%3E%3Cpath d='M12.8 19.6A2 2 0 1 0 14 16H2' fill='none' stroke='white' stroke-width='2.2' stroke-linecap='round'/%3E%3Cpath d='M17.5 8a2.5 2.5 0 1 1 2 4H2' fill='none' stroke='white' stroke-width='2.2' stroke-linecap='round'/%3E%3Cpath d='M9.8 4.4A2 2 0 1 1 11 8H2' fill='none' stroke='white' stroke-width='2.2' stroke-linecap='round'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="style.css" />
</head>
<body class="is-empty">
<div id="app">

  <aside id="sidebar">
    <div class="sidebar-top">
      <button id="sidebar-toggle" class="icon-btn" title="Toggle sidebar" type="button">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="16" rx="3" stroke="currentColor" stroke-width="1.6"/><line x1="9" y1="4" x2="9" y2="20" stroke="currentColor" stroke-width="1.6"/></svg>
      </button>
      <div class="brand"><span class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12.8 19.6A2 2 0 1 0 14 16H2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M17.5 8a2.5 2.5 0 1 1 2 4H2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M9.8 4.4A2 2 0 1 1 11 8H2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </span><span class="brand-name">Agent OS</span></div>
    </div>

    <button id="new-session-btn" class="new-chat-btn" type="button">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span>New chat</span>
    </button>

    <div class="sidebar-block">
      <div class="sidebar-label">Agent</div>
      <select id="agent-select" class="agent-select"></select>
    </div>

    <div class="sidebar-block sessions-block">
      <div class="sidebar-label">Recent</div>
      <ul id="session-list"></ul>
    </div>

    <div class="sidebar-bottom">
      <button id="settings-toggle" class="settings-toggle" type="button">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09a1.65 1.65 0 00-1-1.51 1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09a1.65 1.65 0 001.51-1 1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z" stroke="currentColor" stroke-width="1.2"/></svg>
        <span>Settings</span>
      </button>
      <div id="settings-panel" class="settings-panel">
        <label>Backend URL</label>
        <input id="backend-url" type="text" value="http://127.0.0.1:7777" />
        <label>API key <span class="hint">(only if OS_SECURITY_KEY set)</span></label>
        <input id="api-key" type="password" placeholder="leave blank if none" />
        <div id="connection-status" class="status">not connected</div>
      </div>
    </div>
  </aside>

  <main id="chat-pane">

    <div id="empty-state" class="empty-state">
      <div class="empty-inner">
        <div class="greeting"><span class="greeting-emoji">
          <svg viewBox="0 0 24 24" fill="none"><path d="M12.8 19.6A2 2 0 1 0 14 16H2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M17.5 8a2.5 2.5 0 1 1 2 4H2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M9.8 4.4A2 2 0 1 1 11 8H2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </span><span id="greeting-text">Good afternoon</span></div>
        <p class="empty-note" id="empty-note"></p>
        <div id="composer-dock-top" class="composer-dock"></div>
      </div>
    </div>

    <div id="messages" class="messages"></div>

    <div id="composer-dock-bottom" class="composer-dock composer-dock-bottom"></div>

  </main>

</div>

<form id="composer" class="composer">
  <textarea id="message-input" placeholder="Message the agent..." rows="1"></textarea>
  <div class="composer-toolbar">
    <div class="composer-toolbar-left">
      <span class="agent-pill" id="agent-pill">&mdash;</span>
    </div>
    <div class="composer-toolbar-right">
      <button id="send-btn" type="submit" class="send-btn" title="Send" disabled>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 19V5M5 12l7-7 7 7" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </div>
</form>

<script src="app.js"></script>
</body>
</html>
